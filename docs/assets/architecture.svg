<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">File Agent architecture</title>
  <desc id="desc">Documents become structured blocks and a hybrid index. A LangGraph agent calls read-only tools in an evidence loop and returns grounded answers with sources.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .label { fill: #0f172a; font-size: 18px; font-weight: 650; }
      .body { fill: #475569; font-size: 14px; }
      .eyebrow { fill: #0f766e; font-size: 11px; font-weight: 700; letter-spacing: 1.8px; }
      .line { stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="508" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="43" class="eyebrow">FILE AGENT / SYSTEM MAP</text>
  <text x="32" y="79" class="title">From files to answers you can inspect.</text>

  <rect x="32" y="116" width="266" height="134" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="52" y="145" class="eyebrow">01 / INPUT</text>
  <text x="52" y="177" class="label">Documents</text>
  <text x="52" y="204" class="body">PDF · DOCX · PPTX · XLSX</text>
  <text x="52" y="226" class="body">Markdown · TXT · HTML</text>

  <rect x="322" y="116" width="266" height="134" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="342" y="145" class="eyebrow">02 / INGEST</text>
  <text x="342" y="177" class="label">Structure-aware parsing</text>
  <text x="342" y="204" class="body">Typed blocks · OCR · figures</text>
  <text x="342" y="226" class="body">Token-budgeted chunks + context</text>

  <rect x="612" y="116" width="266" height="134" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="632" y="145" class="eyebrow">03 / INDEX</text>
  <text x="632" y="177" class="label">Hybrid retrieval</text>
  <text x="632" y="204" class="body">BM25 + dense vectors · RRF</text>
  <text x="632" y="226" class="body">Qwen3 embedding + reranker</text>

  <rect x="902" y="116" width="266" height="134" rx="12" fill="#0f766e"/>
  <text x="922" y="145" fill="#ccfbf1" font-size="11" font-weight="700" letter-spacing="1.8">04 / REASON</text>
  <text x="922" y="177" fill="white" font-size="19" font-weight="650">LangGraph agent</text>
  <text x="922" y="204" fill="#f0fdfa" font-size="14">Native model tool calls</text>
  <text x="922" y="226" fill="#f0fdfa" font-size="14">Bounded rounds + compact memory</text>

  <path d="M298 184 H317" class="line"/>
  <path d="M588 184 H607" class="line"/>
  <path d="M878 184 H897" class="line"/>

  <rect x="612" y="337" width="266" height="110" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="632" y="368" class="label">Read-only document tools</text>
  <text x="632" y="395" class="body">Search · navigate · count · tables</text>
  <text x="632" y="419" class="body">Arithmetic · PDF visual analysis</text>
  <path d="M1035 250 V286 H745 V331" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="667" y="313" class="body">Read, observe, repeat</text>

  <rect x="32" y="337" width="556" height="110" rx="12" fill="white" stroke="#cbd5e1"/>
  <text x="52" y="368" class="label">Grounded answer + source evidence</text>
  <text x="52" y="395" class="body">File, page, slide, and sheet coordinates remain attached.</text>
  <text x="52" y="419" class="body">Inspect the answer in chat; export it for checkpointed evaluation.</text>
  <path d="M1105 250 V478 H310 V453" class="line"/>
</svg>
