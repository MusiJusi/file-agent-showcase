services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCAL_LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:18000/v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - pipeline_models:/root/.cache/huggingface
      - ocr_models:/root/.EasyOCR
      - application_logs:/app/logs
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"

volumes:
  pipeline_models:
  ocr_models:
  application_logs:
